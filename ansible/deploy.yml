---
# TIMECHAIN — Debian x64 deployment
# Installs LNbits + webhook server as systemd services.
#
# Prerequisites on your Mac:
#   brew install ansible
#   ansible-galaxy collection install community.general
#
# Usage:
#   cp ansible/env.example .env          # fill in your secrets
#   ansible-playbook -i ansible/inventory.ini ansible/deploy.yml
#
# Re-deploy after code changes:
#   ansible-playbook -i ansible/inventory.ini ansible/deploy.yml --tags app

- name: Deploy TIMECHAIN to Debian x64
  hosts: timechain
  become: true

  vars:
    app_user: spore
    app_dir: /home/spore/timechain_project
    tailscale_auth_key: "{{ lookup('env', 'TAILSCALE_AUTH_KEY') }}"
    python_version: "3.13"
    cloudflare_tunnel_id: "dcfbf63a-3fb7-4fc5-8759-f46bba7bb77f"

  tasks:

    # ── System packages ───────────────────────────────────────────────────────

    - name: Install system dependencies
      apt:
        name:
          # ── Core tools ────────────────────────────────────────────────────
          - git
          - curl
          - ca-certificates

          # ── pygame / SDL2 audio ───────────────────────────────────────────
          - libsdl2-2.0-0
          - libsdl2-mixer-2.0-0
          - libsdl2-image-2.0-0
          - libsdl2-ttf-2.0-0

          # ── Bluetooth ─────────────────────────────────────────────────────
          - bluez                        # BT daemon + bluetoothctl
          - bluetooth                    # service wrapper
          - pulseaudio                   # audio server (required for BT audio on Pi)
          - pulseaudio-module-bluetooth  # BT sink/source for pulseaudio
          - python3-dbus                 # dbus bindings for BT pairing

          # ── coincurve / secp256k1 (lnbits dep, needs cmake to build) ─────
          - cmake
          - libsecp256k1-dev
          - build-essential
          - pkg-config
          - python3-dev

          # ── Misc ─────────────────────────────────────────────────────────
          - openssl                      # LNbits TLS
          - libpq-dev                    # optional LNbits postgres driver
        state: present
        update_cache: true

    # ── Tailscale ─────────────────────────────────────────────────────────────

    - name: Add Tailscale apt key and repo
      shell: |
        curl -fsSL https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg | tee /usr/share/keyrings/tailscale-archive-keyring.gpg > /dev/null
        curl -fsSL https://pkgs.tailscale.com/stable/debian/trixie.tailscale-keyring.list | tee /etc/apt/sources.list.d/tailscale.list
      args:
        creates: /etc/apt/sources.list.d/tailscale.list

    - name: Install tailscale
      apt:
        name: tailscale
        state: present
        update_cache: true

    - name: Enable and start tailscaled
      systemd:
        name: tailscaled
        enabled: true
        state: started

    - name: Authenticate tailscale
      shell: tailscale up --authkey {{ tailscale_auth_key }} --accept-routes

    - name: Enable and start bluetooth service
      systemd:
        name: bluetooth
        enabled: true
        state: started

    # ── uv ────────────────────────────────────────────────────────────────────

    - name: Check if uv is installed
      stat:
        path: /home/{{ app_user }}/.local/bin/uv
      register: uv_bin

    - name: Install uv
      become: false
      shell: curl -LsSf https://astral.sh/uv/install.sh | sh
      when: not uv_bin.stat.exists

    # ── Repos ─────────────────────────────────────────────────────────────────

    - name: Clone timechain_project
      become: false
      git:
        repo: https://github.com/kornpow/TIMECHAIN-proof-of-donate.git
        dest: "{{ app_dir }}"
        version: main
        update: true
      tags: app

    # ── Config ────────────────────────────────────────────────────────────────

    - name: Copy .env file
      become: false
      copy:
        src: ../.env          # from your local project root
        dest: "{{ app_dir }}/.env"
        mode: "0600"
      tags: app

    # ── Python deps ───────────────────────────────────────────────────────────

    - name: Install Python dependencies via uv
      become: false
      shell: |
        export PATH="$HOME/.local/bin:$PATH"
        cd {{ app_dir }}
        uv sync
      tags: app

    - name: Install LNbits via uv tools
      become: false
      shell: |
        export PATH="$HOME/.local/bin:$PATH"
        uv tool install lnbits
      args:
        creates: /home/{{ app_user }}/.local/bin/lnbits

    # ── Sync .env into LNbits package dir ────────────────────────────────────

    - name: Find LNbits package dir
      become: false
      shell: |
        export PATH="$HOME/.local/bin:$PATH"
        find /home/{{ app_user }}/.local/share/uv -path "*/lnbits/lib/*/site-packages" -type d | head -1
      register: lnbits_bin
      changed_when: false

    - name: Copy .env into LNbits package dir
      become: false
      shell: |
        export PATH="$HOME/.local/bin:$PATH"
        LNBITS_DIR=$(find /home/{{ app_user }}/.local/share/uv -path "*/lnbits/lib/*/site-packages" -type d | head -1)
        cp {{ app_dir }}/.env "$LNBITS_DIR/.env"
      tags: app

    # ── systemd: LNbits ───────────────────────────────────────────────────────

    - name: Install LNbits systemd service
      copy:
        dest: /etc/systemd/system/lnbits.service
        content: |
          [Unit]
          Description=LNbits Lightning Payment Server
          After=network-online.target
          Wants=network-online.target

          [Service]
          User={{ app_user }}
          WorkingDirectory=/home/{{ app_user }}/.local/share/uv/tools/lnbits/lib/python3.13/site-packages
          Environment="PATH=/home/{{ app_user }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
          ExecStart=/home/{{ app_user }}/.local/bin/uv tool run lnbits --port 5001
          Restart=always
          RestartSec=5
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target

    # ── systemd: webhook server ───────────────────────────────────────────────

    - name: Install webhook systemd service
      copy:
        dest: /etc/systemd/system/timechain-webhook.service
        content: |
          [Unit]
          Description=TIMECHAIN Webhook Server
          After=lnbits.service
          Wants=lnbits.service

          [Service]
          User={{ app_user }}
          WorkingDirectory={{ app_dir }}
          Environment="PATH=/home/{{ app_user }}/.local/bin:/usr/local/bin:/usr/bin:/bin"
          ExecStart=/home/{{ app_user }}/.local/bin/uv run webhook.py
          Restart=always
          RestartSec=5
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target

    # ── Cloudflare Tunnel (cloudflared) ──────────────────────────────────────

    - name: Check if cloudflared is installed
      stat:
        path: /usr/local/bin/cloudflared
      register: cloudflared_bin

    - name: Download cloudflared (amd64)
      get_url:
        url: https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
        dest: /usr/local/bin/cloudflared
        mode: "0755"
      when: not cloudflared_bin.stat.exists

    - name: Create .cloudflared directory
      become: false
      file:
        path: /home/{{ app_user }}/.cloudflared
        state: directory
        mode: "0700"

    - name: Copy cloudflared tunnel credentials
      become: false
      copy:
        src: ../cloudflare-tunnel-credentials.json   # generate on Mac, copy here
        dest: /home/{{ app_user }}/.cloudflared/credentials.json
        mode: "0600"
        directory_mode: "0700"
      tags: app

    - name: Install cloudflared tunnel config
      become: false
      copy:
        dest: /home/{{ app_user }}/.cloudflared/config.yml
        mode: "0600"
        content: |
          tunnel: {{ cloudflare_tunnel_id }}
          credentials-file: /home/{{ app_user }}/.cloudflared/credentials.json
          ingress:
            - hostname: timechain.win
              service: http://localhost:5001
            - hostname: pay.timechain.win
              service: http://localhost:5001
            - hostname: webhook.timechain.win
              service: http://localhost:8000
            - service: http_status:404
      tags: app

    - name: Install cloudflared systemd service
      copy:
        dest: /etc/systemd/system/cloudflared.service
        content: |
          [Unit]
          Description=Cloudflare Tunnel
          After=network-online.target
          Wants=network-online.target

          [Service]
          User={{ app_user }}
          ExecStart=/usr/local/bin/cloudflared tunnel --config /home/{{ app_user }}/.cloudflared/config.yml run
          Restart=always
          RestartSec=5
          StandardOutput=journal
          StandardError=journal

          [Install]
          WantedBy=multi-user.target

    # ── Enable & start services ───────────────────────────────────────────────

    - name: Reload systemd and enable services
      systemd:
        daemon_reload: true
        name: "{{ item }}"
        enabled: true
        state: restarted
      loop:
        - lnbits
        - timechain-webhook
        - cloudflared
      tags: app
